databases:
  - name: wallet-db
    plan: free
    databaseName: wallet_db
    user: wallet_user

services:
  - type: web
    name: wallet-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
