{% extends "base.html" %}
{% block title %}Iniciar sesión · Vaquí{% endblock %}
{% block content %}
<main class="auth-wrapper">
  <form class="auth-card" method="post">
    <img class="logo logo-lg" src="{{ url_for('static', filename='img/logo-vertical.png') }}" alt="Vaquí">
    <h2>Iniciar sesión</h2>
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    <p class="auth-switch">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
  </form>
</main>
{% endblock %}
