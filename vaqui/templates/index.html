{% extends "base.html" %}
{% block content %}
<main class="landing">
  <div class="landing-card">
    <img class="logo logo-lg" src="{{ url_for('static', filename='img/logo-vertical.png') }}" alt="Vaquí">
    <h1>Consulta y controla tus finanzas personales</h1>
    <p class="subtitle">Registra tus ingresos y gastos, define presupuestos por categoría y mira en un solo lugar cuánto tienes y en qué se va tu dinero.</p>
    <div class="landing-actions">
      <a class="btn btn-primary" href="{{ url_for('auth.register') }}">Crear cuenta</a>
      <a class="btn btn-ghost" href="{{ url_for('auth.login') }}">Iniciar sesión</a>
    </div>
  </div>
</main>
{% endblock %}
